<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My IP</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My IP">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#eef2f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1211" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #eef2f1;
    --panel: #ffffff;
    --fg: #13201d;
    --muted: #5d6e69;
    --line: #d5dedb;
    --accent: #0d7a62;
    --accent-ink: #ffffff;
    --good: #0d7a62;
    --caution: #9a6400;
    --alert: #b23a1c;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1211; --panel: #13201e; --fg: #e4edeb; --muted: #8ea19c;
      --line: #223935; --accent: #3fd1ab; --accent-ink: #062019;
      --good: #3fd1ab; --caution: #f2c14e; --alert: #ff8a6b;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.4 var(--sans); -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  .screen {
    min-height: 100%; max-width: 520px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 16px;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
  }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .label {
    font: 600 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  }
  .status { display: inline-flex; align-items: center; gap: 7px; font: 600 11px/1 var(--mono); letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.ok .dot { background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }
  .status.err .dot { background: var(--alert); }
  .status.busy .dot { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  .hero { display: grid; gap: 6px; }
  .ip {
    font: 700 clamp(30px, 10vw, 46px)/1.05 var(--mono); letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; overflow-wrap: anywhere; margin: 0;
  }
  .ip6 { font: 500 12px/1.4 var(--mono); color: var(--muted); overflow-wrap: anywhere; min-height: 1.4em; }

  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .cell { background: var(--panel); padding: 12px 14px; display: grid; gap: 5px; align-content: start; min-width: 0; }
  .cell.wide { grid-column: 1 / -1; }
  .cell .v { font: 600 16px/1.3 var(--sans); overflow-wrap: anywhere; }
  .cell .v.mono { font-family: var(--mono); font-size: 16px; }
  .cell .sub { font: 400 12px/1.35 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  .flag { font-size: 19px; line-height: 1; margin-right: 6px; vertical-align: -2px; }

  .verdict { display: inline-flex; align-items: center; gap: 7px; font: 600 15px/1.2 var(--sans); }
  .verdict::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .verdict.good { color: var(--good); }   .verdict.good::before { background: var(--good); }
  .verdict.caution { color: var(--caution); } .verdict.caution::before { background: var(--caution); }
  .verdict.alert { color: var(--alert); } .verdict.alert::before { background: var(--alert); }

  .spacer { flex: 1; }

  footer { display: grid; gap: 10px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button {
    font: 600 16px/1 var(--sans); padding: 14px 12px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .5; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .meta { text-align: center; font: 400 11px/1.4 var(--mono); color: var(--muted); }

  @media (max-height: 620px) {
    .screen { gap: 12px; }
    .cell { padding: 9px 12px; gap: 3px; }
    .cell .v { font-size: 15px; }
    button { padding: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .status.busy .dot { animation: none; } button:active { transform: none; } }
</style>
</head>
<body>
<main class="screen">
  <header>
    <span class="label" id="ipLabel">External IP</span>
    <span class="status busy" id="status"><span class="dot"></span><span id="statusText">Checking</span></span>
  </header>

  <section class="hero">
    <p class="ip" id="ip">···</p>
    <div class="ip6" id="ip6"></div>
  </section>

  <section class="grid">
    <div class="cell wide">
      <span class="label">Provider</span>
      <span class="v" id="isp">—</span>
      <span class="sub" id="domain"></span>
    </div>
    <div class="cell">
      <span class="label">AS number</span>
      <span class="v mono" id="asn">—</span>
    </div>
    <div class="cell">
      <span class="label">VPN</span>
      <span class="verdict" id="vpn">Checking</span>
      <span class="sub" id="vpnWhy"></span>
    </div>
    <div class="cell wide">
      <span class="label">Location</span>
      <span class="v" id="loc">—</span>
      <span class="sub" id="coords"></span>
    </div>
    <div class="cell">
      <span class="label">ZIP code</span>
      <span class="v mono" id="zip">—</span>
    </div>
    <div class="cell">
      <span class="label">Local IP</span>
      <span class="v mono" id="lan">—</span>
      <span class="sub" id="lanWhy"></span>
    </div>
    <div class="cell wide">
      <span class="label">Time zone</span>
      <span class="v" id="tz">—</span>
    </div>
  </section>

  <div class="spacer"></div>

  <footer>
    <div class="actions">
      <button class="primary" id="copy" type="button" disabled>Copy IP</button>
      <button id="refresh" type="button">Refresh</button>
    </div>
    <div class="meta" id="meta"></div>
  </footer>
</main>

<script>
  const $ = id => document.getElementById(id);

  async function getJSON(url) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 7000);
    try {
      const r = await fetch(url, { cache: "no-store", signal: ctrl.signal });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } finally { clearTimeout(t); }
  }

  // Each source is normalised to the same shape. Tried in order until one works.
  const sources = [
    async () => {
      const d = await getJSON("https://ipwho.is/");
      if (d.success === false) throw new Error(d.message);
      const c = d.connection || {};
      return {
        ip: d.ip, type: d.type, city: d.city, region: d.region, country: d.country,
        zip: d.postal, flag: d.flag && d.flag.emoji, lat: d.latitude, lon: d.longitude,
        asn: c.asn, isp: c.isp || c.org, org: c.org, domain: c.domain,
        tz: d.timezone && d.timezone.id, security: d.security, src: "ipwho.is"
      };
    },
    async () => {
      const d = await getJSON("https://ipapi.co/json/");
      if (d.error) throw new Error(d.reason);
      return {
        ip: d.ip, type: d.version, city: d.city, region: d.region, country: d.country_name,
        zip: d.postal, flag: flagFor(d.country_code), lat: d.latitude, lon: d.longitude,
        asn: d.asn, isp: d.org, tz: d.timezone, src: "ipapi.co"
      };
    },
    async () => {
      const d = await getJSON("https://ipinfo.io/json");
      const m = /^(AS\d+)\s+(.*)$/.exec(d.org || "");
      const [lat, lon] = (d.loc || ",").split(",");
      return {
        ip: d.ip, type: d.ip && d.ip.includes(":") ? "IPv6" : "IPv4",
        city: d.city, region: d.region, country: d.country, zip: d.postal, flag: flagFor(d.country),
        lat, lon, asn: m ? m[1] : "", isp: m ? m[2] : d.org, tz: d.timezone, src: "ipinfo.io"
      };
    }
  ];

  function flagFor(cc) {
    if (!cc || cc.length !== 2) return "";
    return String.fromCodePoint(...[...cc.toUpperCase()].map(c => 0x1F1A5 + c.charCodeAt(0)));
  }

  function setStatus(kind, text) {
    $("status").className = "status " + kind;
    $("statusText").textContent = text;
  }

  // ---------- VPN detection ----------
  // Combines a VPN/proxy database lookup (ipapi.is, free, no key) with checks done on the phone.
  // No method is certain, so the result is worded as "likely" / "possible".
  const HOSTING = /(hosting|datacenter|data center|colo|server|vps|vpn|proxy|m247|datacamp|digitalocean|linode|vultr|choopa|ovh|hetzner|leaseweb|contabo|amazon|aws|google cloud|microsoft|azure|oracle|clouvider|g-core|gcore|packethub|tefincom|mullvad|nordvpn|proton|expressvpn|surfshark|private internet|cyberghost|windscribe|zscaler|hostroyale|31173)/i;
  const RELAY = /(cloudflare|akamai|fastly)/i;

  function utcOffsetMinutes(tz) {
    try {
      const now = new Date();
      const there = new Date(now.toLocaleString("en-US", { timeZone: tz }));
      const utc = new Date(now.toLocaleString("en-US", { timeZone: "UTC" }));
      return Math.round((there - utc) / 60000);
    } catch { return null; }
  }

  async function checkVpn(info) {
    let db = null;
    try { db = await getJSON("https://api.ipapi.is/"); } catch {}
    const sec = info.security || {};
    const name = [info.isp, info.org, db && db.company && db.company.name, db && db.asn && db.asn.org].filter(Boolean).join(" ");
    const vpnName = db && db.vpn && db.vpn.service;

    if ((db && db.is_tor) || sec.tor) return ["alert", "Tor", "Tor exit node"];
    if ((db && db.is_vpn) || sec.vpn) return ["alert", "Likely", vpnName ? vpnName : "Listed as a VPN server"];
    if ((db && db.is_proxy) || sec.proxy) return ["alert", "Likely", "Listed as a proxy"];
    if (RELAY.test(name)) return ["caution", "Likely", "iCloud Private Relay or VPN"];
    if ((db && db.is_datacenter) || sec.hosting || HOSTING.test(name)) return ["caution", "Likely", "Data-center network"];

    const here = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const a = utcOffsetMinutes(here), b = info.tz ? utcOffsetMinutes(info.tz) : null;
    if (a !== null && b !== null && a !== b) return ["caution", "Possible", "Phone and IP time zones differ"];

    return ["good", "Not detected", db ? "Home or mobile network" : "Basic checks only"];
  }

  // ---------- Local IP ----------
  // Browsers (Safari especially) hide the local address from web pages for privacy.
  // This tries anyway; when hidden, it shows where to find it on an iPhone.
  function findLocalIp() {
    return new Promise(resolve => {
      if (!window.RTCPeerConnection) return resolve(null);
      let pc, done = false;
      const finish = v => { if (done) return; done = true; try { pc.close(); } catch {} resolve(v); };
      try {
        pc = new RTCPeerConnection({ iceServers: [] });
        pc.createDataChannel("x");
        pc.onicecandidate = e => {
          if (!e.candidate) return finish(null);
          const m = /(\d{1,3}(?:\.\d{1,3}){3})/.exec(e.candidate.candidate);
          if (m && /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.)/.test(m[1])) finish(m[1]);
        };
        pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => finish(null));
        setTimeout(() => finish(null), 1500);
      } catch { finish(null); }
    });
  }

  async function showLocalIp() {
    const ip = await findLocalIp();
    if (ip) { $("lan").textContent = ip; $("lanWhy").textContent = "This device"; }
    else {
      $("lan").textContent = "Hidden";
      $("lanWhy").textContent = /iPhone|iPad/.test(navigator.userAgent) ? "Settings › Wi‑Fi › ⓘ" : "Blocked by browser";
    }
  }

  // ---------- Main ----------
  async function lookup() {
    $("refresh").disabled = true;
    setStatus("busy", "Checking");
    $("vpn").className = "verdict"; $("vpn").textContent = "Checking"; $("vpnWhy").textContent = "";
    showLocalIp();

    let info = null;
    for (const src of sources) {
      try { info = await src(); if (info && info.ip) break; } catch (e) { info = null; }
    }
    // A separate IPv6 check, shown only if it differs from the main address.
    const v6 = fetch("https://api6.ipify.org", { cache: "no-store" }).then(r => r.text()).catch(() => "");

    if (!info) {
      $("ip").textContent = "Unavailable";
      setStatus("err", "Offline");
      $("vpn").textContent = "—";
      $("meta").textContent = "Could not reach any lookup service. Check your connection, then tap Refresh.";
      $("copy").disabled = true;
      $("refresh").disabled = false;
      return;
    }

    const asn = info.asn ? (String(info.asn).startsWith("AS") ? info.asn : "AS" + info.asn) : "—";
    $("ipLabel").textContent = "External " + (info.type || "IP");
    $("ip").textContent = info.ip;
    $("isp").textContent = info.isp || "—";
    $("domain").textContent = info.domain || "";
    $("asn").textContent = asn;
    $("zip").textContent = info.zip || "—";
    $("loc").textContent = "";
    if (info.flag) { const f = document.createElement("span"); f.className = "flag"; f.textContent = info.flag; $("loc").append(f); }
    $("loc").append([info.city, info.region].filter(Boolean).join(", ") || "—");
    $("coords").textContent = [info.country, info.lat && info.lon ? `${(+info.lat).toFixed(3)}, ${(+info.lon).toFixed(3)}` : ""].filter(Boolean).join(" · ");
    $("tz").textContent = info.tz ? `${info.tz} · ${localTime(info.tz)}` : "—";
    $("copy").disabled = false;
    setStatus("ok", "Online");
    $("meta").textContent = `Checked ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })} · via ${info.src}`;
    $("refresh").disabled = false;

    const [kind, verdict, why] = await checkVpn(info);
    $("vpn").className = "verdict " + kind;
    $("vpn").textContent = verdict;
    $("vpnWhy").textContent = why;

    const ip6 = (await v6).trim();
    $("ip6").textContent = ip6 && ip6.includes(":") && ip6 !== info.ip ? "IPv6 " + ip6 : "";
  }

  function localTime(tz) {
    try { return new Date().toLocaleTimeString([], { timeZone: tz, hour: "2-digit", minute: "2-digit" }); }
    catch { return ""; }
  }

  $("refresh").addEventListener("click", lookup);
  $("copy").addEventListener("click", async () => {
    const ip = $("ip").textContent;
    try { await navigator.clipboard.writeText(ip); $("copy").textContent = "Copied"; }
    catch { getSelection().selectAllChildren($("ip")); $("copy").textContent = "Selected"; }
    setTimeout(() => ($("copy").textContent = "Copy IP"), 1500);
  });
  // Re-check when you come back to the app (e.g. after switching Wi-Fi / mobile data or turning a VPN on).
  document.addEventListener("visibilitychange", () => { if (!document.hidden) lookup(); });

  lookup();
</script>
</body>
</html>
