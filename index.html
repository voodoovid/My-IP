<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My IP</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My IP">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#eef2f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1211" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #eef2f1;
    --panel: #ffffff;
    --fg: #13201d;
    --muted: #5d6e69;
    --line: #d5dedb;
    --accent: #0d7a62;
    --accent-ink: #ffffff;
    --good: #0d7a62;
    --caution: #9a6400;
    --sun: #e09a00;
    --water: #2f7fc1;
    --moon-lit: #ece6cf;
    --moon-dark: #3a4643;
    --alert: #b23a1c;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    --ip-max: 46px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1211; --panel: #13201e; --fg: #e4edeb; --muted: #8ea19c;
      --line: #223935; --accent: #3fd1ab; --accent-ink: #062019;
      --good: #3fd1ab; --caution: #f2c14e; --alert: #ff8a6b;
      --sun: #f5c04a; --water: #6fb3ee; --moon-lit: #f1ecd6; --moon-dark: #24302e;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.4 var(--sans); -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  .screen {
    min-height: 100%; max-width: 520px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
  }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .label {
    font: 600 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  }
  .status { display: inline-flex; align-items: center; gap: 7px; font: 600 11px/1 var(--mono); letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.ok .dot { background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }
  .status.err .dot { background: var(--alert); }
  .status.busy .dot { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  .hero { display: grid; gap: 2px; justify-items: center; text-align: center;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .ip {
    font: 700 var(--ip-max)/1.05 var(--mono); letter-spacing: -.02em; white-space: nowrap;
    font-variant-numeric: tabular-nums; overflow-wrap: anywhere; margin: 0;
  }
  .ip6 { font: 500 12px/1.2 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  .ip6:empty { display: none; }
  .histline {
    font: 500 12px/1.3 var(--mono); color: var(--muted); background: none; border: 0; padding: 4px 8px;
    border-radius: 999px; min-height: 0;
  }
  .histline:empty { display: none; }
  .histline .go { color: var(--accent); font-weight: 600; }
  .histline.changed { color: var(--caution); background: color-mix(in srgb, var(--caution) 14%, transparent); }

  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .cell { background: var(--panel); padding: 8px 13px; display: grid; gap: 4px; align-content: start; min-width: 0; }
  .cell.wide { grid-column: 1 / -1; }
  .cell .v { font: 600 16px/1.3 var(--sans); overflow-wrap: anywhere; }
  .cell .v.mono { font-family: var(--mono); font-size: 16px; }
  .cell .sub { font: 400 12px/1.35 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  /* The map fills the right column beside Location, ZIP code and Local IP. */
  .mapcell { grid-column: 2; grid-row: span 3; position: relative; padding: 0; min-height: 120px; }
  #locCell { grid-column: 1; }
  .minimap {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none; background: var(--bg);
    z-index: 0; isolation: isolate;
  }
  .minimap:empty { visibility: hidden; }
  .minimap .leaflet-control-attribution { font-size: 7px; line-height: 1.2; padding: 0 3px; background: rgb(255 255 255 / .7); }
  @media (prefers-color-scheme: dark) { .minimap .leaflet-tile-pane { filter: brightness(.82) contrast(1.05); } }
  .cell.tap { cursor: pointer; }
  .wxcell { grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 8px; }
  .wx-text { display: grid; gap: inherit; min-width: 0; align-content: center; }
  .wx-line { display: flex; align-items: center; gap: 6px; }
  .wx-icons { display: inline-flex; align-items: center; gap: 4px; }
  .wx-icons svg { width: 22px; height: 22px; flex: none; }
  .moon { display: grid; justify-items: center; gap: 3px; }
  .moon svg { width: 34px; height: 34px; display: block; }
  .moon .moon-name { font: 500 9px/1.15 var(--mono); color: var(--muted); text-align: center; max-width: 64px; }
  /* Phones: the moon sits small in the box's top-right corner (its name is in the tooltip). */
  @media (max-width: 699px) {
    .wxcell { grid-template-columns: minmax(0, 1fr); position: relative; }
    .moon { position: absolute; top: 7px; right: 10px; }
    .moon svg { width: 24px; height: 24px; }
    .moon .moon-name { display: none; }
  }
  .cell.tap:active { background: color-mix(in srgb, var(--panel) 92%, var(--fg)); }
  .cell.tap:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .flag { font-size: 19px; line-height: 1; margin-right: 6px; vertical-align: -2px; }

  .verdict { display: inline-flex; align-items: center; gap: 7px; font: 600 15px/1.2 var(--sans); }
  .verdict::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .verdict.good { color: var(--good); }   .verdict.good::before { background: var(--good); }
  .verdict.caution { color: var(--caution); } .verdict.caution::before { background: var(--caution); }
  .verdict.alert { color: var(--alert); } .verdict.alert::before { background: var(--alert); }

  .nettype { justify-self: start; font: 600 12px/1 var(--sans); padding: 5px 9px; border-radius: 999px;
    color: var(--muted); background: color-mix(in srgb, var(--muted) 14%, transparent); }
  .nettype:empty { display: none; }
  .nettype.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
  .nettype.caution { color: var(--caution); background: color-mix(in srgb, var(--caution) 16%, transparent); }
  .nettype.alert { color: var(--alert); background: color-mix(in srgb, var(--alert) 14%, transparent); }

  /* Rows keep their natural height; any spare screen height is shared out between them. */
  .grid { flex: 1 0 auto; grid-auto-rows: auto; align-content: stretch; }
  .cell { align-content: center; }
  /* Taller phones (e.g. the Home Screen app): slightly larger text to use the extra height. */
  @media (max-width: 699px) and (min-height: 740px) {
    :root { --ip-max: 52px; }
    .screen { gap: 14px; }
    .cell .v { font-size: 18px; }
    .cell .v.mono { font-size: 18px; }
    .cell .sub { font-size: 13px; }
    .label { font-size: 12px; }
    button { padding-block: 16px; }
  }

  footer { display: grid; gap: 10px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  button {
    font: 600 16px/1 var(--sans); padding: 14px 12px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  }
  .speedbtn { display: grid; place-content: center; gap: 3px; padding: 6px 4px; font-variant-numeric: tabular-nums; }
  .sp-main { white-space: nowrap; }
  .sp-unit { font: 500 9px/1 var(--mono); color: var(--muted); white-space: nowrap; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .5; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .meta { text-align: center; font: 400 11px/1.4 var(--mono); color: var(--muted); }

  /* Pop-up panel for the map, speed test and IP history. */
  .backdrop { position: fixed; inset: 0; background: rgb(0 0 0 / .45); z-index: 1000; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 1001; max-height: 88%;
    display: flex; flex-direction: column; background: var(--panel); color: var(--fg);
    border-radius: 18px 18px 0 0; border: 1px solid var(--line);
    padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
  .sheet-head h2 { margin: 0; font: 700 19px/1.2 var(--sans); }
  .sheet-head button { padding: 9px 14px; font-size: 15px; }
  .sheet-body { overflow: auto; min-height: 0; display: grid; gap: 14px; }
  .note { margin: 0; font: 400 13px/1.45 var(--sans); color: var(--muted); }
  .note.diag { font: 400 11px/1.4 var(--mono); }
  .accurate { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  .accurate-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btnlink {
    display: block; text-align: center; text-decoration: none; font: 600 15px/1 var(--sans);
    padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--accent);
  }
  .btnlink:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #map { height: min(60vh, 520px); border-radius: 12px; border: 1px solid var(--line); background: var(--bg); }
  .speedrow { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: stretch; }
  .speedrow > button { min-width: 100px; padding: 0 14px; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .stat { background: var(--panel); padding: 10px 7px; display: grid; gap: 5px; min-width: 0; }
  .stat .label { font-size: 10px; letter-spacing: .08em; }
  .stat .num { font: 700 20px/1 var(--mono); font-variant-numeric: tabular-nums; }
  .stat .unit { font: 400 12px/1 var(--mono); color: var(--muted); }
  .hist-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .hist-list li { background: var(--panel); padding: 11px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; }
  .hist-list .hip { font: 600 15px/1.3 var(--mono); overflow-wrap: anywhere; }
  .hist-list .hwhen { font: 400 12px/1.3 var(--mono); color: var(--muted); text-align: right; }
  .hist-list .hsub { grid-column: 1 / -1; font: 400 12px/1.35 var(--sans); color: var(--muted); }
  .hist-list li.now .hip::after { content: "  now"; font: 600 11px/1 var(--sans); color: var(--accent); }

  @media (max-height: 620px) {
    .screen { gap: 12px; }
    .cell { padding: 9px 12px; gap: 3px; }
    .cell .v { font-size: 15px; }
    .cell .sub { font-size: 11px; }
    :root { --ip-max: 40px; }
    .histline { padding: 2px 6px; }
    button { padding: 12px; }
  }
  /* Tablets (iPad): fill the whole screen and scale everything up. */
  @media (min-width: 700px) and (min-height: 700px) {
    .screen {
      min-height: 100%; max-width: none; gap: 22px;
      padding: calc(env(safe-area-inset-top, 0px) + 36px) 44px calc(env(safe-area-inset-bottom, 0px) + 32px);
    }
    .label, .status { font-size: 13px; }
    .dot { width: 10px; height: 10px; }
    :root { --ip-max: 112px; }
    .ip6 { font-size: 16px; }
    .grid { border-radius: 20px; }
    .cell { padding: 16px 26px; gap: 8px; align-content: center; }
    .cell .v { font-size: 26px; }
    .cell .v.mono { font-size: 28px; }
    .cell .sub { font-size: 16px; }
    .nettype { font-size: 16px; padding: 7px 13px; }
    .flag { font-size: 30px; margin-right: 10px; }
    .verdict { font-size: 26px; gap: 12px; }
    .verdict::before { width: 14px; height: 14px; }
    .wx-icons svg { width: 34px; height: 34px; }
    .wx-line { gap: 10px; }
    .moon svg { width: 64px; height: 64px; }
    .moon .moon-name { font-size: 12px; max-width: 120px; }
    .actions { gap: 16px; }
    button { font-size: 21px; padding: 22px 16px; border-radius: 16px; }
    .meta { font-size: 14px; }
    .histline { font-size: 15px; padding: 6px 12px; }
    .minimap .leaflet-control-attribution { font-size: 9px; }
    .sheet { left: 50%; right: auto; bottom: auto; top: 50%; transform: translate(-50%, -50%);
      width: min(760px, 90vw); max-height: 86%; border-radius: 20px; padding: 24px; }
    .sheet-head h2 { font-size: 24px; }
    .stat { padding: 16px 14px; gap: 8px; }
    .stat .label { font-size: 12px; }
    .stat .num { font-size: 40px; }
    .speedrow > button { min-width: 170px; }
    .sp-unit { font-size: 12px; }
  }
  /* Tablet landscape: same single column, tighter so it fits the shorter screen. */
  @media (min-width: 700px) and (min-height: 700px) and (orientation: landscape) {
    :root { --ip-max: 76px; }
    .screen { gap: 14px; padding-top: calc(env(safe-area-inset-top, 0px) + 18px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); }
    .cell { padding: 9px 26px; gap: 4px; }
    .cell .v { font-size: 24px; }
    .cell .v.mono { font-size: 25px; }
    .cell .sub { font-size: 15px; }
    .nettype { font-size: 15px; padding: 5px 12px; }
    .wx-icons svg { width: 30px; height: 30px; }
    .moon svg { width: 54px; height: 54px; }
    button { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .status.busy .dot { animation: none; } button:active { transform: none; } }
</style>
</head>
<body>
<main class="screen">
  <header>
    <span class="label" id="ipLabel">External IP</span>
    <span class="status busy" id="status"><span class="dot"></span><span id="statusText">Checking</span></span>
  </header>

  <section class="hero">
    <p class="ip" id="ip">···</p>
    <div class="ip6" id="ip6"></div>
    <button class="histline" id="hist" type="button"></button>
  </section>

  <section class="grid">
    <div class="cell wide">
      <span class="label">Provider</span>
      <span class="v" id="isp">—</span>
      <span class="sub" id="domain"></span>
    </div>
    <div class="cell">
      <span class="label">Autonomous System</span>
      <span class="v mono" id="asn">—</span>
      <span class="nettype" id="nettype"></span>
    </div>
    <div class="cell">
      <span class="label">VPN</span>
      <span class="verdict" id="vpn">Checking</span>
      <span class="sub" id="vpnWhy"></span>
    </div>
    <div class="cell tap" id="locCell" role="button" tabindex="0" aria-label="Location. Show larger map">
      <span class="label">Location</span>
      <span class="v" id="loc">—</span>
      <span class="sub" id="coords"></span>
    </div>
    <div class="cell mapcell tap" id="mapCell" role="button" tabindex="0" aria-label="Show larger map">
      <div class="minimap" id="minimap"></div>
    </div>
    <div class="cell">
      <span class="label">ZIP code</span>
      <span class="v mono" id="zip">—</span>
    </div>
    <div class="cell">
      <span class="label">Local IP</span>
      <span class="v mono" id="lan">—</span>
      <span class="sub" id="lanWhy"></span>
    </div>
    <div class="cell">
      <span class="label">Local time</span>
      <span class="v mono" id="tz">—</span>
      <span class="sub" id="tzName"></span>
    </div>
    <div class="cell wxcell">
      <div class="wx-text">
        <span class="label">Weather</span>
        <span class="v mono wx-line"><span id="wx">—</span><span class="wx-icons" id="wxIcons"></span></span>
        <span class="sub" id="wxWhy"></span>
        <span class="sub" id="wxWind"></span>
      </div>
      <span class="moon" id="moon" role="img"></span>
    </div>
  </section>

  <footer>
    <div class="actions">
      <button class="primary" id="refresh" type="button">Refresh</button>
      <button class="speedbtn" id="speed" type="button" aria-label="Speed test"><span class="sp-main" id="spMain">Speed test</span><span class="sp-unit" id="spUnit" hidden></span></button>
      <button id="copy" type="button" disabled>Copy IP</button>
    </div>
    <div class="meta" id="meta"></div>
  </footer>
</main>

<div class="backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-head">
    <h2 id="sheetTitle"></h2>
    <button id="sheetClose" type="button">Close</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<script>
  // Bump this and version.json together on every change, so Home Screen apps pick up the update.
  const APP_VERSION = "22";
  const $ = id => document.getElementById(id);

  // Home Screen apps keep their own cached copy of the page. Ask the server for the latest
  // version number (never cached) and reload with a new address when it differs.
  async function checkForUpdate() {
    try {
      const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
      const { v } = await r.json();
      if (v && v !== APP_VERSION && new URLSearchParams(location.search).get("v") !== v)
        location.replace(location.pathname + "?v=" + encodeURIComponent(v));
    } catch {}
  }
  checkForUpdate();

  async function getJSON(url) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 7000);
    try {
      const r = await fetch(url, { cache: "no-store", signal: ctrl.signal });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } finally { clearTimeout(t); }
  }

  // Each source is normalised to the same shape. Tried in order until one works.
  const sources = [
    async () => {
      const d = await getJSON("https://ipwho.is/");
      if (d.success === false) throw new Error(d.message);
      const c = d.connection || {};
      return {
        ip: d.ip, type: d.type, city: d.city, region: d.region, country: d.country,
        zip: d.postal, cc: d.country_code, flag: d.flag && d.flag.emoji, lat: d.latitude, lon: d.longitude,
        asn: c.asn, isp: c.isp || c.org, org: c.org, domain: c.domain,
        tz: d.timezone && d.timezone.id, security: d.security, src: "ipwho.is"
      };
    },
    async () => {
      const d = await getJSON("https://ipapi.co/json/");
      if (d.error) throw new Error(d.reason);
      return {
        ip: d.ip, type: d.version, city: d.city, region: d.region, country: d.country_name,
        zip: d.postal, cc: d.country_code, flag: flagFor(d.country_code), lat: d.latitude, lon: d.longitude,
        asn: d.asn, isp: d.org, tz: d.timezone, src: "ipapi.co"
      };
    },
    async () => {
      const d = await getJSON("https://ipinfo.io/json");
      const m = /^(AS\d+)\s+(.*)$/.exec(d.org || "");
      const [lat, lon] = (d.loc || ",").split(",");
      return {
        ip: d.ip, type: d.ip && d.ip.includes(":") ? "IPv6" : "IPv4",
        city: d.city, region: d.region, country: d.country, zip: d.postal, cc: d.country, flag: flagFor(d.country),
        lat, lon, asn: m ? m[1] : "", isp: m ? m[2] : d.org, tz: d.timezone, src: "ipinfo.io"
      };
    }
  ];

  function flagFor(cc) {
    if (!cc || cc.length !== 2) return "";
    return String.fromCodePoint(...[...cc.toUpperCase()].map(c => 0x1F1A5 + c.charCodeAt(0)));
  }

  function setStatus(kind, text) {
    $("status").className = "status " + kind;
    $("statusText").textContent = text;
  }

  // ---------- VPN detection ----------
  // Combines a VPN/proxy database lookup (ipapi.is, free, no key) with checks done on the phone.
  // No method is certain, so the result is worded as "likely" / "possible".
  const HOSTING = /(hosting|datacenter|data center|colo|server|vps|vpn|proxy|m247|datacamp|digitalocean|linode|vultr|choopa|ovh|hetzner|leaseweb|contabo|amazon|aws|google cloud|microsoft|azure|oracle|clouvider|g-core|gcore|packethub|tefincom|mullvad|nordvpn|proton|expressvpn|surfshark|private internet|cyberghost|windscribe|zscaler|hostroyale|31173)/i;
  const RELAY = /(cloudflare|akamai|fastly)/i;

  function utcOffsetMinutes(tz) {
    try {
      const now = new Date();
      const there = new Date(now.toLocaleString("en-US", { timeZone: tz }));
      const utc = new Date(now.toLocaleString("en-US", { timeZone: "UTC" }));
      return Math.round((there - utc) / 60000);
    } catch { return null; }
  }

  // ---------- Network type ----------
  // What kind of network the IP belongs to. Uses ipapi.is's classification when it answers,
  // and well-known provider names and words when it doesn't. Always returns a label.
  const MOBILE = /(wireless|mobile|mobility|cellular|t-mobile|tmobile|verizon wireless|cellco|at&t mobility|sprint|us cellular|vodafone|o2 |ee limited|three|telefonica moviles)/i;
  const SATELLITE = /(starlink|space exploration|hughes|viasat|echostar|inmarsat|iridium|oneweb)/i;
  const EDUCATION = /(universit|college|school|academ|institute of technology|\.edu\b|research and education|internet2|educational)/i;
  const GOVERNMENT = /(government|\bcounty\b|\bcity of\b|\bstate of\b|department of|ministry|federal|municipal|\bgov\b|national guard)/i;
  const BANKING = /(\bbank\b|bancorp|financial services|credit union)/i;
  // Words typical of home internet providers' names; used only when nothing more specific matched.
  const HOME_WORDS = /(broadband|cable|fiber|fibre|dsl|telephone|cooperative|co-op)/i;
  const HOME_ISP = /(comcast|xfinity|charter|spectrum|cox|at&t|verizon|frontier|centurylink|lumen|qwest|optimum|altice|suddenlink|windstream|mediacom|wideopenwest|wow!|rcn|astound|wave broadband|wave ?division|vanoppen|grande communications|sonic|google fiber|ziply|brightspeed|consolidated|tds|cable one|sparklight|rogers|bell canada|shaw|videotron|telus|cogeco|british telecom|bt |sky |virgin media|talktalk|telstra|optus|deutsche telekom|orange|free sas|bouygues|kpn|ziggo|swisscom|telenor|telia)/i;

  // Returns [colour, label]. Colours: "alert" red, "caution" amber, "good" green, "" grey.
  function networkType(info, db) {
    const sec = info.security || {};
    const name = [info.isp, info.org, db && db.company && db.company.name, db && db.asn && db.asn.org].filter(Boolean).join(" ");
    const type = String((db && ((db.company && db.company.type) || (db.asn && db.asn.type))) || "").toLowerCase();
    if ((db && db.is_tor) || sec.tor) return ["alert", "Tor"];
    if ((db && db.is_vpn) || sec.vpn) return ["alert", "VPN"];
    if ((db && db.is_proxy) || sec.proxy) return ["alert", "Proxy"];
    if (RELAY.test(name)) return ["caution", "Relay / CDN"];
    if ((db && db.is_datacenter) || sec.hosting || type === "hosting" || HOSTING.test(name)) return ["caution", "Data center"];
    if (type === "education" || EDUCATION.test(name)) return ["", "Education"];
    if (type === "government" || GOVERNMENT.test(name)) return ["", "Government"];
    if (type === "banking" || BANKING.test(name)) return ["", "Banking"];
    if (SATELLITE.test(name)) return ["good", "Satellite"];
    if ((db && db.is_mobile) || MOBILE.test(name)) return ["good", "Mobile network"];
    if (type === "isp" || HOME_ISP.test(name)) return ["good", "Residential"];
    if (type === "business") return ["", "Business"];
    if (HOME_WORDS.test(name)) return ["good", "Residential"];
    return ["", "Unknown type"];
  }

  function checkVpn(info, db) {
    const sec = info.security || {};
    const name = [info.isp, info.org, db && db.company && db.company.name, db && db.asn && db.asn.org].filter(Boolean).join(" ");
    const vpnName = db && db.vpn && db.vpn.service;

    if ((db && db.is_tor) || sec.tor) return ["alert", "Tor", "Tor exit node"];
    if ((db && db.is_vpn) || sec.vpn) return ["alert", "Likely", vpnName ? vpnName : "Listed as a VPN server"];
    if ((db && db.is_proxy) || sec.proxy) return ["alert", "Likely", "Listed as a proxy"];
    if (RELAY.test(name)) return ["caution", "Likely", "iCloud Private Relay or VPN"];
    if ((db && db.is_datacenter) || sec.hosting || HOSTING.test(name)) return ["caution", "Likely", "Data-center network"];

    const here = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const a = utcOffsetMinutes(here), b = info.tz ? utcOffsetMinutes(info.tz) : null;
    if (a !== null && b !== null && a !== b) return ["caution", "Possible", "Phone and IP time zones differ"];

    const [, net] = networkType(info, db);
    return ["good", "Not detected", net === "Unknown type" ? (db ? "No VPN signs found" : "Basic checks only")
      : net === "Mobile network" ? net : `${net} network`];
  }

  // ---------- Local IP ----------
  // Browsers (Safari especially) hide the local address from web pages for privacy.
  // This tries anyway; when hidden, it shows where to find it on an iPhone.
  function findLocalIp() {
    return new Promise(resolve => {
      if (!window.RTCPeerConnection) return resolve(null);
      let pc, done = false;
      const finish = v => { if (done) return; done = true; try { pc.close(); } catch {} resolve(v); };
      try {
        pc = new RTCPeerConnection({ iceServers: [] });
        pc.createDataChannel("x");
        pc.onicecandidate = e => {
          if (!e.candidate) return finish(null);
          const m = /(\d{1,3}(?:\.\d{1,3}){3})/.exec(e.candidate.candidate);
          if (m && /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.)/.test(m[1])) finish(m[1]);
        };
        pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => finish(null));
        setTimeout(() => finish(null), 1500);
      } catch { finish(null); }
    });
  }

  async function showLocalIp() {
    const ip = await findLocalIp();
    if (ip) { $("lan").textContent = ip; $("lanWhy").textContent = "This device"; }
    else {
      $("lan").textContent = "Hidden";
      $("lanWhy").textContent = /iPhone|iPad/.test(navigator.userAgent) ? "Settings › Wi‑Fi › ⓘ" : "Blocked by browser";
    }
  }

  // ---------- Hostname (reverse DNS) ----------
  function ptrName(ip) {
    if (!ip.includes(":")) return ip.split(".").reverse().join(".") + ".in-addr.arpa";
    // Expand IPv6 to 32 hex digits, then reverse them nibble by nibble.
    const [head, tail = ""] = ip.split("::");
    const h = head ? head.split(":") : [], t = tail ? tail.split(":") : [];
    const groups = [...h, ...Array(8 - h.length - t.length).fill("0"), ...t];
    return groups.map(g => g.padStart(4, "0")).join("").split("").reverse().join(".") + ".ip6.arpa";
  }
  async function reverseDns(ip) {
    const name = ptrName(ip);
    const tries = [
      () => getJSON(`https://dns.google/resolve?name=${name}&type=PTR`),
      () => fetch(`https://cloudflare-dns.com/dns-query?name=${name}&type=PTR`, { headers: { accept: "application/dns-json" } }).then(r => r.json())
    ];
    for (const t of tries) {
      try {
        const d = await t();
        const a = (d.Answer || []).find(x => x.type === 12);
        return a ? a.data.replace(/\.$/, "") : "";
      } catch {}
    }
    return "";
  }

  // ---------- Weather (Open-Meteo, free, no key) ----------
  const WX = [[[0], "Clear", "clear"], [[1], "Mostly clear", "partly"], [[2], "Partly cloudy", "partly"], [[3], "Cloudy", "cloud"],
    [[45, 48], "Fog", "fog"], [[51, 53, 55, 56, 57], "Drizzle", "rain"], [[61, 63, 65, 66, 67], "Rain", "rain"],
    [[71, 73, 75, 77], "Snow", "snow"], [[80, 81, 82], "Showers", "rain"], [[85, 86], "Snow showers", "snow"],
    [[95, 96, 99], "Thunderstorm", "storm"]];

  // Small line icons, drawn in the page's colours.
  const CLOUD = '<path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 11.1 3.5 3.5 0 0 0 7 18z" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-linejoin="round"/>';
  const SUN_RAYS = '<g stroke="var(--sun)" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g>';
  const ICONS = {
    clearDay: `<circle cx="12" cy="12" r="4.2" fill="var(--sun)"/>${SUN_RAYS}`,
    clearNight: '<path d="M15.5 3.5a8.5 8.5 0 1 0 5 13.6A7 7 0 0 1 15.5 3.5z" fill="var(--moon-lit)" stroke="var(--muted)" stroke-width="1.2"/>',
    partlyDay: '<circle cx="9" cy="9" r="3.4" fill="var(--sun)"/><g stroke="var(--sun)" stroke-width="1.6" stroke-linecap="round"><path d="M9 2.2v1.4M2.2 9h1.4M4.2 4.2l1 1M13.8 4.2l-1 1"/></g>' + CLOUD.replace('fill="none"', 'fill="var(--panel)"'),
    partlyNight: '<path d="M11 3.2a5 5 0 1 0 3.3 8.4A4.2 4.2 0 0 1 11 3.2z" fill="var(--moon-lit)" stroke="var(--muted)" stroke-width="1"/>' + CLOUD.replace('fill="none"', 'fill="var(--panel)"'),
    cloud: CLOUD,
    fog: '<g stroke="var(--muted)" stroke-width="1.8" stroke-linecap="round"><path d="M4 9h16M3 13h18M5 17h14"/></g>',
    rain: CLOUD.replace('M7 18h10', 'M7 15h10').replace('A3.5 3.5 0 0 0 7 18z', 'A3.5 3.5 0 0 0 7 15z').replace('a4 4 0 0 0 .6-7.96', 'a4 4 0 0 0 .6-7.96') +
      '<g stroke="var(--water)" stroke-width="1.8" stroke-linecap="round"><path d="M8.5 18l-1 3M12.5 18l-1 3M16.5 18l-1 3"/></g>',
    snow: CLOUD.replace('M7 18h10', 'M7 15h10').replace('A3.5 3.5 0 0 0 7 18z', 'A3.5 3.5 0 0 0 7 15z') +
      '<g fill="var(--water)"><circle cx="8" cy="19" r="1.2"/><circle cx="12" cy="21" r="1.2"/><circle cx="16" cy="19" r="1.2"/></g>',
    storm: CLOUD.replace('M7 18h10', 'M7 15h10').replace('A3.5 3.5 0 0 0 7 18z', 'A3.5 3.5 0 0 0 7 15z') +
      '<path d="M12.5 15.5l-2.5 4h3l-1.5 3.5" fill="none" stroke="var(--sun)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
    wind: '<g fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-linecap="round"><path d="M3 9h11a2.5 2.5 0 1 0-2.5-2.5"/><path d="M3 13h15a2.5 2.5 0 1 1-2.5 2.5"/><path d="M3 17h7"/></g>'
  };
  const icon = (name, title) => `<svg viewBox="0 0 24 24" role="img" aria-label="${title}"><title>${title}</title>${ICONS[name]}</svg>`;

  // ---------- Moon phase (calculated on the device, no lookup needed) ----------
  function moonPhase(date = new Date()) {
    const synodic = 29.530588853;
    const ref = Date.UTC(2000, 0, 6, 18, 14); // a known new moon
    const p = (((date - ref) / 86400000 / synodic) % 1 + 1) % 1; // 0 new, 0.5 full
    const names = [[0.0339, "New moon"], [0.216, "Waxing crescent"], [0.284, "First quarter"], [0.466, "Waxing gibbous"],
      [0.534, "Full moon"], [0.716, "Waning gibbous"], [0.784, "Last quarter"], [0.966, "Waning crescent"], [1.01, "New moon"]];
    return { p, lit: Math.round((1 - Math.cos(2 * Math.PI * p)) / 2 * 100), name: names.find(([lim]) => p < lim)[1] };
  }
  function moonSvg(p) {
    const r = 10, cx = 12, cy = 12, top = `${cx} ${cy - r}`, bottom = `${cx} ${cy + r}`;
    const rx = Math.abs(Math.cos(2 * Math.PI * p)) * r;
    const waxing = p < 0.5;
    // Lit half: right side while waxing, left side while waning. The terminator is an ellipse arc.
    const litSweep = waxing ? 1 : 0;
    const termSweep = (p < 0.25 || (p >= 0.5 && p < 0.75)) ? 0 : 1;
    const lit = (p < 0.0339 || p > 0.966) ? "" :
      `<path d="M${top} A${r} ${r} 0 0 ${litSweep} ${bottom} A${rx.toFixed(2)} ${r} 0 0 ${termSweep} ${top}z" fill="var(--moon-lit)"/>`;
    return `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--moon-dark)" stroke="var(--line)" stroke-width="0.8"/>${lit}</svg>`;
  }
  function showMoon() {
    const m = moonPhase();
    $("moon").innerHTML = moonSvg(m.p) + `<span class="moon-name">${m.name}</span>`;
    $("moon").setAttribute("aria-label", `Moon: ${m.name}, ${m.lit}% lit`);
    $("moon").title = `${m.name} · ${m.lit}% lit`;
  }
  async function showWeather(info) {
    $("wx").textContent = "—"; $("wxWhy").textContent = ""; $("wxWind").textContent = ""; $("wxIcons").innerHTML = "";
    showMoon();
    if (!info.lat || !info.lon) return;
    const us = ["US", "LR", "MM"].includes(String(info.cc || "").toUpperCase());
    try {
      const d = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${info.lat}&longitude=${info.lon}` +
        `&current=temperature_2m,weather_code,wind_speed_10m,is_day` +
        (us ? "&temperature_unit=fahrenheit&wind_speed_unit=mph" : ""));
      if (current !== info) return;
      const c = d.current;
      const [, sky = "", kind = ""] = WX.find(([codes]) => codes.includes(c.weather_code)) || [];
      const day = c.is_day !== 0;
      const iconName = kind === "clear" ? (day ? "clearDay" : "clearNight") : kind === "partly" ? (day ? "partlyDay" : "partlyNight") : kind;
      const windy = c.wind_speed_10m >= (us ? 15 : 24);
      $("wx").textContent = `${Math.round(c.temperature_2m)}°${us ? "F" : "C"}`;
      $("wxIcons").innerHTML = (iconName ? icon(iconName, sky) : "") + (windy ? icon("wind", "Windy") : "");
      $("wxWhy").textContent = sky;
      $("wxWind").textContent = `Wind ${Math.round(c.wind_speed_10m)} ${us ? "mph" : "km/h"}`;
    } catch { $("wxWhy").textContent = "Unavailable"; }
  }

  // ---------- IP history (kept only on this device) ----------
  const HIST_KEY = "myip-history";
  function loadHist() { try { return JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch { return []; } }
  function saveHist(h) { try { localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0, 30))); } catch {} }
  const fmtWhen = t => new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const histEntry = info => ({ ip: info.ip, isp: info.isp || "", place: [info.city, info.region].filter(Boolean).join(", "), first: Date.now(), last: Date.now() });

  function recordHist(info) {
    const h = loadHist();
    if (h[0] && h[0].ip === info.ip) h[0].last = Date.now();
    else h.unshift(histEntry(info));
    saveHist(h);
    showHistLine(h);
  }
  function showHistLine(h) {
    const btn = $("hist"); btn.className = "histline"; btn.textContent = "";
    if (!h.length) return;
    const recent = h.length > 1 && Date.now() - h[0].first < 15 * 60 * 1000;
    const text = h.length === 1 ? "First check on this device"
      : recent ? `Changed from ${h[1].ip}` : `Same IP since ${fmtWhen(h[0].first)}`;
    if (recent) btn.classList.add("changed");
    const go = document.createElement("span"); go.className = "go"; go.textContent = " · History ›";
    btn.append(text, go);
  }

  // ---------- Pop-up panel ----------
  let lastFocus = null;
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  function openSheet(title, build) {
    lastFocus = document.activeElement;
    $("sheetTitle").textContent = title;
    $("sheetBody").replaceChildren();
    $("backdrop").hidden = false; $("sheet").hidden = false;
    build($("sheetBody"));
    $("sheetClose").focus();
  }
  function closeSheet() {
    $("backdrop").hidden = true; $("sheet").hidden = true; $("sheetBody").replaceChildren();
    if (lastFocus) lastFocus.focus();
  }
  $("sheetClose").addEventListener("click", closeSheet);
  $("backdrop").addEventListener("click", closeSheet);
  addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });

  function openHistory() {
    openSheet("IP history", body => {
      const h = loadHist();
      body.append(el("p", "note", "IP addresses this device has seen, newest first. Stored only on this device."));
      const list = el("ul", "hist-list");
      h.forEach((r, i) => {
        const li = el("li", i === 0 ? "now" : "");
        li.append(el("span", "hip", r.ip), el("span", "hwhen", fmtWhen(r.first)),
          el("span", "hsub", [r.isp, r.place, r.last - r.first > 60000 ? "last seen " + fmtWhen(r.last) : ""].filter(Boolean).join(" · ")));
        list.append(li);
      });
      body.append(list);
      const clear = el("button", "", "Clear history"); clear.type = "button";
      clear.addEventListener("click", () => {
        if (!clear.dataset.sure) { clear.dataset.sure = "1"; clear.textContent = "Tap again to clear"; return; }
        saveHist(current ? [histEntry(current)] : []);
        closeSheet();
        showHistLine(loadHist());
      });
      body.append(clear);
    });
  }

  // Map: Leaflet (hosted in this repository, vendor/leaflet) + OpenStreetMap tiles.
  let leafletReady = null;
  function loadLeaflet() {
    if (!leafletReady) leafletReady = new Promise((ok, fail) => {
      const css = document.createElement("link");
      css.rel = "stylesheet"; css.href = "vendor/leaflet/leaflet.css";
      document.head.append(css);
      const js = document.createElement("script");
      js.src = "vendor/leaflet/leaflet.js";
      js.onload = ok; js.onerror = () => { leafletReady = null; fail(); };
      document.head.append(js);
    });
    return leafletReady;
  }
  let miniMap = null, miniDot = null;
  // Keep the map filling its box when the screen rotates or the layout changes.
  new ResizeObserver(() => { if (miniMap) miniMap.invalidateSize(); }).observe($("minimap"));
  async function showMiniMap(info) {
    const box = $("minimap");
    if (!info.lat || !info.lon) { box.style.visibility = "hidden"; return; }
    box.style.visibility = "";
    try {
      await loadLeaflet();
      if (current !== info) return;
      const pos = [+info.lat, +info.lon];
      const color = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
      if (!miniMap) {
        miniMap = L.map(box, { zoomControl: false, dragging: false, touchZoom: false, scrollWheelZoom: false,
          doubleClickZoom: false, boxZoom: false, keyboard: false, attributionControl: true });
        miniMap.attributionControl.setPrefix(false);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(miniMap);
        miniDot = L.circleMarker(pos, { radius: 5, color: "#ffffff", weight: 2, fillColor: color, fillOpacity: 1 }).addTo(miniMap);
      }
      miniMap.setView(pos, 10); miniDot.setLatLng(pos);
      miniMap.invalidateSize();
    } catch { box.style.visibility = "hidden"; }
  }

  function openMap() {
    if (!current) return;
    const place = [current.city, current.region, current.country].filter(Boolean).join(", ");
    openSheet(place || "Location", async body => {
      if (!current.lat || !current.lon) { body.append(el("p", "note", "No map position is available for this IP.")); return; }
      const box = el("div"); box.id = "map"; body.append(box);
      body.append(el("p", "note", `Approximate location of your provider's network (${(+current.lat).toFixed(3)}, ${(+current.lon).toFixed(3)}), not your exact position.`));
      try {
        await loadLeaflet();
        if (!box.isConnected) return;
        const lat = +current.lat, lon = +current.lon;
        const map = L.map(box).setView([lat, lon], 11);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "© OpenStreetMap contributors" }).addTo(map);
        const color = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
        L.circle([lat, lon], { radius: 4000, color, weight: 1, fillOpacity: .15 }).addTo(map);
        L.circleMarker([lat, lon], { radius: 7, color: "#ffffff", weight: 2, fillColor: color, fillOpacity: 1 }).addTo(map);
        setTimeout(() => map.invalidateSize(), 50);
      } catch { box.replaceWith(el("p", "note", "The map couldn't load. Check your connection and try again.")); }
    });
  }

  // ---------- Speed test (Cloudflare's public speed test servers) ----------
  const CF = "https://speed.cloudflare.com";
  let speedRun = null;
  const fmtMbps = v => v >= 100 ? String(Math.round(v)) : v >= 10 ? v.toFixed(1) : v.toFixed(2);

  // One shared speed result, shown on the main button and in the panel.
  // The automatic test is the quick one; the panel's "Run again" runs the full test.
  const speed = { down: null, up: null, ping: null, jitter: null, phase: "", running: false, error: false, at: 0, ip: "" };
  const SPEED_KEY = "myip-speed";
  try { Object.assign(speed, JSON.parse(localStorage.getItem(SPEED_KEY)) || {}, { running: false, phase: "" }); } catch {}
  const speedViews = new Set();
  function renderSpeed() {
    const main = $("spMain"), unit = $("spUnit");
    if (speed.running && speed.down == null) { main.textContent = "Testing…"; unit.hidden = true; }
    else if (speed.down != null) {
      const short = v => v >= 10 ? String(Math.round(v)) : v.toFixed(1);
      main.textContent = `↓${short(speed.down)} ↑${speed.up != null ? short(speed.up) : "…"}`;
      unit.textContent = speed.running ? "testing…"
        : "Mbps" + (speed.ping != null ? ` · ping ${Math.round(speed.ping)} ms` : ""); unit.hidden = false;
    } else { main.textContent = "Speed test"; unit.hidden = true; }
    $("speed").setAttribute("aria-label", speed.down != null ? `Speed test: download ${fmtMbps(speed.down)}, upload ${speed.up != null ? fmtMbps(speed.up) : "pending"} megabits per second` +
      (speed.ping != null ? `, ping ${Math.round(speed.ping)} milliseconds` : "") : "Speed test");
    speedViews.forEach(f => f());
  }

  // The measuring is done by Cloudflare's own speed test engine (@cloudflare/speedtest 1.14.1, MIT),
  // the code behind speed.cloudflare.com, hosted in this repository. Its results reporting to
  // Cloudflare is switched off (logAimApiUrl: null), and the packet loss test (which needs another
  // server) is left out.
  // Each direction runs requests of growing size, and stops growing once requests take over a second.
  // Automatic rough check: a few seconds, about 20 MB each way at most. The full test only runs on request.
  const QUICK_TEST = [
    { type: "latency", numPackets: 1 },
    { type: "download", bytes: 1e5, count: 1, bypassMinDuration: true },
    { type: "latency", numPackets: 10 },
    { type: "download", bytes: 1e6, count: 2 },
    { type: "download", bytes: 1e7, count: 2 },
    { type: "upload", bytes: 1e5, count: 2 },
    { type: "upload", bytes: 1e6, count: 2 },
    { type: "upload", bytes: 1e7, count: 2 }
  ];
  const FULL_TEST = [ // the same sequence speed.cloudflare.com uses, without packet loss
    { type: "latency", numPackets: 2 },
    { type: "download", bytes: 1e5, count: 1, bypassMinDuration: true },
    { type: "latency", numPackets: 20 },
    { type: "download", bytes: 1e5, count: 9 },
    { type: "latency", numPackets: 2 },
    { type: "download", bytes: 1e6, count: 8 },
    { type: "latency", numPackets: 2 },
    { type: "upload", bytes: 1e5, count: 8 },
    { type: "latency", numPackets: 2 },
    { type: "upload", bytes: 1e6, count: 6 },
    { type: "latency", numPackets: 2 },
    { type: "download", bytes: 1e7, count: 6 },
    { type: "latency", numPackets: 2 },
    { type: "upload", bytes: 1e7, count: 4 },
    { type: "latency", numPackets: 2 },
    { type: "download", bytes: 2.5e7, count: 4 },
    { type: "latency", numPackets: 2 },
    { type: "upload", bytes: 2.5e7, count: 4 },
    { type: "latency", numPackets: 2 },
    { type: "download", bytes: 1e8, count: 3 },
    { type: "latency", numPackets: 2 },
    { type: "upload", bytes: 5e7, count: 3 },
    { type: "latency", numPackets: 2 },
    { type: "download", bytes: 2.5e8, count: 2 }
  ];
  let SpeedTestEngine = null;
  const loadEngine = async () => SpeedTestEngine ||= (await import("./vendor/cloudflare-speedtest/speedtest.js")).default;

  async function runSpeed(quick) {
    if (speed.running) return;
    speedRun = new AbortController(); const { signal } = speedRun;
    Object.assign(speed, { running: true, error: false, phase: "Measuring ping…" },
      quick && speed.down != null ? {} : { down: null, up: null, ping: null, jitter: null });
    renderSpeed();
    let errors = 0;
    try {
      const Engine = await loadEngine();
      const engine = new Engine({ autoStart: false, logAimApiUrl: null, measurements: quick ? QUICK_TEST : FULL_TEST,
        downloadApiUrl: `${CF}/__down`, uploadApiUrl: `${CF}/__up`,
        bandwidthPercentile: 0.9, latencyPercentile: 0.5,
        // The rough check skips the extra ping measurements during transfers, to keep it short.
        ...(quick ? { measureDownloadLoadedLatency: false, measureUploadLoadedLatency: false } : {}) });
      const r = () => engine.results;
      const mbps = bps => bps ? bps / 1e6 : null;
      engine.onError = () => { errors++; };
      let stalled = false;
      engine.onResultsChange = ({ type } = {}) => {
        if (type === "latency") speed.phase = "Measuring ping…";
        else if (type === "download") speed.phase = "Measuring download…";
        else if (type === "upload") speed.phase = "Measuring upload…";
        if (!quick) {
          const res = r();
          speed.ping = res.getUnloadedLatency() ?? speed.ping;
          speed.jitter = res.getUnloadedJitter() ?? speed.jitter;
          speed.down = mbps(res.getDownloadBandwidth()) ?? speed.down;
          speed.up = mbps(res.getUploadBandwidth()) ?? speed.up;
        }
        renderSpeed();
      };
      await new Promise((resolve, reject) => {
        // If a request hangs (seen in Safari), stop after 20 s without a finished measurement and keep
        // what was measured. Background ping checks during transfers don't count as progress.
        const done = () => { const x = r(); return (x.getDownloadBandwidthPoints() || []).length +
          (x.getUploadBandwidthPoints() || []).length + (x.getUnloadedLatencyPoints() || []).length; };
        let last = -1, lastAt = Date.now();
        const watchdog = setInterval(() => {
          let n = last; try { n = done(); } catch {}
          if (n !== last) { last = n; lastAt = Date.now(); }
          else if (Date.now() - lastAt > 20000) { stalled = true; clearInterval(watchdog); engine.pause(); resolve(); }
        }, 2000);
        engine.onFinish = () => { clearInterval(watchdog); resolve(); };
        signal.addEventListener("abort", () => { clearInterval(watchdog); engine.pause(); reject(new DOMException("Aborted", "AbortError")); }, { once: true });
        engine.play();
      });
      const res = r();
      const down = mbps(res.getDownloadBandwidth()), up = mbps(res.getUploadBandwidth());
      if (down == null && up == null) throw new Error("no results");
      const proto = (performance.getEntriesByType("resource").filter(e => e.name.startsWith(CF)).pop() || {}).nextHopProtocol;
      Object.assign(speed, {
        down, up, ping: res.getUnloadedLatency(), jitter: res.getUnloadedJitter(),
        loadedDown: res.getDownLoadedLatency(), loadedUp: res.getUpLoadedLatency(),
        stalled, diag: { engine: "Cloudflare speedtest 1.14.1", proto: proto || "unknown",
          samples: (res.getUnloadedLatencyPoints() || []).length, errors },
        at: Date.now(), ip: current ? current.ip : "", isp: current ? current.isp : "", quick: !!quick });
      try { localStorage.setItem(SPEED_KEY, JSON.stringify({ down: speed.down, up: speed.up, ping: speed.ping, jitter: speed.jitter,
        loadedDown: speed.loadedDown, loadedUp: speed.loadedUp, at: speed.at, ip: speed.ip, isp: speed.isp, quick: speed.quick, stalled: speed.stalled, diag: speed.diag })); } catch {}
    } catch {
      if (!signal.aborted) speed.error = true;
      else Object.assign(speed, JSON.parse(localStorage.getItem(SPEED_KEY) || "{}"));
    } finally {
      speed.running = false; speed.phase = ""; speedRun = null; renderSpeed();
    }
  }
  // Test when the app opens, and again when the IP changes or the last result is over 30 minutes old.
  function autoSpeed(info) {
    if (speed.running || document.hidden) return;
    if (speed.ip === info.ip && Date.now() - speed.at < 30 * 60 * 1000) return;
    runSpeed(true);
  }
  function stopSpeed() { if (speedRun && speed.running) speedRun.abort(); }

  function openSpeed() {
    openSheet("Speed test", body => {
      const stats = el("div", "stats");
      const stat = (label, unit) => {
        const c = el("div", "stat"), n = el("span", "num", "—"), u = el("span", "unit", unit);
        c.append(el("span", "label", label), n, u); stats.append(c); return [n, u];
      };
      const narrow = matchMedia("(max-width: 699px)").matches; // phones: shorter labels so four boxes fit
      const [down] = stat(narrow ? "Down" : "Download", "Mbps"), [up] = stat(narrow ? "Up" : "Upload", "Mbps"),
        [png] = stat("Ping", "ms"), [jit] = stat("Jitter", "ms");
      const again = el("button", "primary", "Run again"); again.type = "button";
      const row = el("div", "speedrow"); row.append(again, stats);
      const status = el("p", "note", "");
      const accurate = el("div", "accurate");
      accurate.append(el("p", "note", "These numbers are an in-browser estimate. Safari doesn't let a page on another site test as fast as Cloudflare's own site or a speed test app. For an accurate reading:"));
      const links = el("div", "accurate-links");
      const link = (text, href) => { const a = el("a", "btnlink", text); a.href = href; a.target = "_blank"; a.rel = "noopener"; links.append(a); return a; };
      link("speed.cloudflare.com", "https://speed.cloudflare.com/");
      link("Speedtest app", "speedtest://");
      accurate.append(links, el("p", "note", "The Speedtest app link only works if the Ookla Speedtest app is installed."));
      const diagLine = el("p", "note diag", "");
      body.append(row, status, accurate, diagLine);

      const view = () => {
        if (!again.isConnected) { speedViews.delete(view); return; }
        down.textContent = speed.down != null ? fmtMbps(speed.down) : "—";
        up.textContent = speed.up != null ? fmtMbps(speed.up) : "—";
        png.textContent = speed.ping != null ? Math.round(speed.ping) : "—";
        jit.textContent = speed.jitter != null ? Math.round(speed.jitter) : "—";
        again.disabled = speed.running; again.textContent = speed.running ? "Testing…" : "Run again";
        const g = speed.diag;
        diagLine.textContent = g && g.engine && !speed.running ? `${g.engine} · connection ${g.proto} · ${g.samples} ping samples · ${g.errors} errors` : "";
        status.textContent = speed.running ? speed.phase
          : speed.error ? "The speed test server couldn't be reached. Check your connection and try again."
          : speed.at ? (speed.quick ? "Quick test" : "Full test") + (speed.stalled ? " (stopped early: a request stalled)" : "") +
              ` at ${new Date(speed.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}` +
              (speed.isp ? ` on ${speed.isp.replace(/\.$/, "")}` : "") + (speed.loadedDown ? `. Ping while downloading ${Math.round(speed.loadedDown)} ms` +
              (speed.loadedUp ? `, while uploading ${Math.round(speed.loadedUp)} ms` : "") : "") +
              (speed.quick ? ". Run again for the full test, the same one speed.cloudflare.com runs." : ".")
          : "";
      };
      speedViews.add(view);
      again.addEventListener("click", () => runSpeed(false));
      if (!speed.running && !speed.at) runSpeed(false); else view();
    });
  }

  $("hist").addEventListener("click", openHistory);
  $("speed").addEventListener("click", openSpeed);
  for (const c of [$("locCell"), $("mapCell")]) {
    c.addEventListener("click", openMap);
    c.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openMap(); } });
  }

  renderSpeed();

  // ---------- Main ----------
  let current = null;

  async function lookup() {
    $("refresh").disabled = true;
    setStatus("busy", "Checking");
    $("vpn").className = "verdict"; $("vpn").textContent = "Checking"; $("vpnWhy").textContent = "";
    $("nettype").textContent = "";
    showLocalIp();

    let info = null;
    for (const src of sources) {
      try { info = await src(); if (info && info.ip) break; } catch (e) { info = null; }
    }
    // A separate IPv6 check, shown only if it differs from the main address.
    // The other address family: IPv6 when the main IP is IPv4, and IPv4 when it's IPv6.
    // These services answer over that family only, so a failure means the connection doesn't have it.
    const otherFamily = info && info.ip.includes(":") ? "IPv4" : "IPv6";
    const otherCtl = new AbortController(); setTimeout(() => otherCtl.abort(), 6000);
    const other = fetch(otherFamily === "IPv6" ? "https://api6.ipify.org" : "https://api4.ipify.org", { cache: "no-store", signal: otherCtl.signal })
      .then(r => r.text()).catch(() => "");

    if (!info) {
      $("ip").textContent = "Unavailable";
      setStatus("err", "Offline");
      $("vpn").textContent = "—";
      $("meta").textContent = "Could not reach any lookup service. Check your connection, then tap Refresh.";
      $("copy").disabled = true;
      $("refresh").disabled = false;
      return;
    }

    const asn = info.asn ? (String(info.asn).startsWith("AS") ? info.asn : "AS" + info.asn) : "—";
    $("ipLabel").textContent = "External " + (info.type || "IP");
    $("ip").textContent = info.ip;
    $("isp").textContent = info.isp || "—";
    $("domain").textContent = info.domain || "";
    current = info;
    $("asn").textContent = asn;
    $("zip").textContent = info.zip || "—";
    $("loc").textContent = "";
    if (info.flag) { const f = document.createElement("span"); f.className = "flag"; f.textContent = info.flag; $("loc").append(f); }
    $("loc").append(info.city || info.region || "—");
    $("coords").textContent = [info.city ? info.region : "", info.cc && String(info.cc).toUpperCase() === "US" ? "US" : info.country].filter(Boolean).join(", ");
    $("tz").textContent = info.tz ? localTime(info.tz) : "—";
    $("tzName").textContent = info.tz ? info.tz.replace(/_/g, " ") : "";
    recordHist(info);
    showWeather(info);
    showMiniMap(info);
    autoSpeed(info);
    reverseDns(info.ip).then(h => { if (current === info) $("domain").textContent = h || info.domain || ""; });
    $("copy").disabled = false;
    setStatus("ok", "Online");
    $("meta").textContent = `Checked ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })} · via ${info.src} · v${APP_VERSION}`;
    $("refresh").disabled = false;

    let db = null;
    try { db = await getJSON("https://api.ipapi.is/"); } catch {}
    const [netKind, net] = networkType(info, db);
    $("nettype").className = "nettype " + netKind;
    $("nettype").textContent = net;
    const [kind, verdict, why] = checkVpn(info, db);
    $("vpn").className = "verdict " + kind;
    $("vpn").textContent = verdict;
    $("vpnWhy").textContent = why;

    const ip2 = (await other).trim();
    if (current !== info) return;
    $("ip6").textContent = ip2 && ip2 !== info.ip && (otherFamily === "IPv6") === ip2.includes(":")
      ? `${otherFamily} ${ip2}` : `No ${otherFamily} on this connection`;
  }

  // Largest font size (up to --ip-max) at which the IP fits on one line.
  function fitIp() {
    const el = $("ip");
    const max = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--ip-max")) || 46;
    const chars = Math.max(el.textContent.length, 7);
    el.style.fontSize = Math.floor(Math.min(max, el.parentElement.clientWidth / (chars * 0.62))) + "px";
  }
  new MutationObserver(fitIp).observe($("ip"), { childList: true, characterData: true, subtree: true });
  addEventListener("resize", fitIp);
  fitIp();

  function localTime(tz) {
    try { return new Date().toLocaleTimeString([], { timeZone: tz, hour: "2-digit", minute: "2-digit" }); }
    catch { return ""; }
  }

  $("refresh").addEventListener("click", lookup);
  $("copy").addEventListener("click", async () => {
    const ip = $("ip").textContent;
    try { await navigator.clipboard.writeText(ip); $("copy").textContent = "Copied"; }
    catch {
      const t = document.createElement("textarea");
      t.value = ip; t.setAttribute("readonly", ""); t.style.cssText = "position:fixed;opacity:0;top:0;left:0";
      document.body.append(t); t.select();
      const ok = document.execCommand("copy"); t.remove(); getSelection().removeAllRanges();
      $("copy").textContent = ok ? "Copied" : "Copy failed";
    }
    setTimeout(() => ($("copy").textContent = "Copy IP"), 1500);
  });
  // Re-check when you come back to the app (e.g. after switching Wi-Fi / mobile data or turning a VPN on).
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopSpeed();
    else { checkForUpdate(); lookup(); }
  });

  lookup();
</script>
</body>
</html>
